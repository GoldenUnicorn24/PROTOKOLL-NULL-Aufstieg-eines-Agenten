name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/src/main/**"
      - "app/src/test/java/de/protokollnull/agent/ScreenshotTest.kt"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Robolectric-Laufzeit cachen
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-14-10818077-i6

      - name: Robolectric-Laufzeit vorab laden (mit Wiederholungen)
        run: |
          V=14-robolectric-10818077-i6
          D=~/.m2/repository/org/robolectric/android-all-instrumented/$V
          mkdir -p $D
          for f in android-all-instrumented-$V.pom android-all-instrumented-$V.jar; do
            for ext in "" ".sha512" ".sha1"; do
              [ -s "$D/$f$ext" ] && continue
              curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o "$D/$f$ext" "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$V/$f$ext" || rm -f "$D/$f$ext"
            done
          done
          ls -la $D

      - name: Screenshots mit Roborazzi aufnehmen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon recordRoborazziDebug --tests "de.protokollnull.agent.ScreenshotTest" 2>&1 | tee shots.log; exit ${PIPESTATUS[0]}
      - name: Screenshots committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "docs: Screenshots der Kernscreens aktualisiert [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
