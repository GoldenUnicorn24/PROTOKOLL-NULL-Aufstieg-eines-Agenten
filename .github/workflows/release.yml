name: Release-APK

# Manuell auslösbar. Signiert nur, wenn die Secrets PN_KEYSTORE_BASE64, PN_KEYSTORE_PASSWORD,
# PN_KEY_ALIAS und PN_KEY_PASSWORD gesetzt sind; sonst entsteht eine unsignierte Release-APK.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Keystore aus Secret wiederherstellen (optional)
        env:
          KS: ${{ secrets.PN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "PN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; else echo "Kein Keystore-Secret – Release-APK bleibt unsigniert."; fi
      - name: Release-APK bauen
        env:
          PN_KEYSTORE_PASSWORD: ${{ secrets.PN_KEYSTORE_PASSWORD }}
          PN_KEY_ALIAS: ${{ secrets.PN_KEY_ALIAS }}
          PN_KEY_PASSWORD: ${{ secrets.PN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease
      - name: Release-APK hochladen
        uses: actions/upload-artifact@v5
        with:
          name: ProtokollNull-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
