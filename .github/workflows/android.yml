name: Android CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Tests & Debug-APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Gradle-Wrapper ausführbar machen
        run: chmod +x gradlew

      - name: Robolectric-Laufzeit cachen
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-14-10818077-i6

      - name: Robolectric-Laufzeit vorab laden (mit Wiederholungen)
        run: |
          V=14-robolectric-10818077-i6
          D=~/.m2/repository/org/robolectric/android-all-instrumented/$V
          mkdir -p $D
          for f in android-all-instrumented-$V.pom android-all-instrumented-$V.jar; do
            for ext in "" ".sha512" ".sha1"; do
              [ -s "$D/$f$ext" ] && continue
              curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o "$D/$f$ext" "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$V/$f$ext" || rm -f "$D/$f$ext"
            done
          done
          ls -la $D

      - name: Unit-Tests & Datenvalidierung
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Fehler als Annotation melden
        if: failure()
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            msg=$(grep -E '^e: |error:|FAILED|What went wrong|Exception|expected:|AssertionError' "$f" | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$msg" ] && echo "::error title=$f::$msg"
          done
          true

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v5
        with:
          name: ProtokollNull-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
